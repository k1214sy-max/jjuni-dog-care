<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쭌이 강아지 관리</title>
<style>
body {
  font-family: sans-serif;
  background: #fff8ef;
  text-align: center;
  padding: 20px;
  color: #594538;
}
h1 { color: #e58b55; }
.box {
  background: white;
  padding: 18px;
  margin: 15px 0;
  border-radius: 15px;
}
button {
  background: #f1b58c;
  border: none;
  padding: 12px;
  border-radius: 10px;
  font-size: 16px;
}
</style>
</head>
<body>
<h1>🐶 쭌이 건강 관리</h1>
<div class="box">
  <h3>🍚 밥 먹기</h3>
  <button onclick="alert('밥 먹기를 기록했어요!')">식사 기록</button>
</div>
<div class="box">
  <h3>🚶 산책</h3>
  <button onclick="alert('산책을 기록했어요!')">산책 기록</button>
</div>
<div class="box">
  <h3>💊 건강 관리</h3>
  <button onclick="alert('건강 기록을 확인해 주세요!')">건강 기록</button>
</div>
</body>
</html>
